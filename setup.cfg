[metadata]
name = sublevel-rules
version = attr: sublevel_rules.__version__
description = Declarative rule engine mapping a version folder to importable resources (sub level)
long_description = file: README.md
long_description_content_type = text/markdown
author = Wenfeng Zhang
author_email = zwf.vfx@foxmail.com
license = MIT
keywords = pipeline, vfx, sublevel, rules, asset, import
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Topic :: Software Development :: Libraries :: Python Modules
    Typing :: Typed

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.7
zip_safe = False

[options.packages.find]
where = src

[options.package_data]
sublevel_rules = py.typed

[options.entry_points]
console_scripts =
    sublevel-rules = sublevel_rules.cli:main

[options.extras_require]
test =
    pytest>=6.2
dev =
    pytest>=6.2
    flake8>=5.0
    mypy>=0.991
yaml =
    PyYAML>=5.1

[flake8]
max-line-length = 100
exclude =
    .git,
    .venv-*,
    build,
    dist,
    __pycache__,
    *.egg-info

[mypy]
# No ``python_version`` pin on purpose: recent mypy releases dropped 3.7 as a
# target, while 3.7 compatibility is covered by actually running the test suite
# on 3.7 (see the CI matrix).
files = src/sublevel_rules
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True

[mypy-yaml]
# PyYAML ships no type stubs and carries no py.typed marker.
ignore_missing_imports = True
