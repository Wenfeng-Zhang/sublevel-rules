name: tests

on:
  push:
  pull_request:
  release:
    types: [published]

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every leg is listed explicitly, because the runner image matters:
        # ``ubuntu-latest`` is Ubuntu 24.04 now and actions/setup-python ships no
        # builds of the older interpreters for it, so 3.7 - 3.10 run on
        # ``ubuntu-22.04`` (which still has them) and 3.11 runs on the current
        # image. Windows covers the oldest and the newest supported version;
        # macOS only the newest, because its runners are arm64 and there is no
        # 3.7 build for that platform.
        #
        # When ubuntu-22.04 is retired, the oldest legs have to move to a
        # container (`docker run python:3.7`) or be dropped.
        include:
          - os: ubuntu-22.04
            python-version: '3.7'
          - os: ubuntu-22.04
            python-version: '3.8'
          - os: ubuntu-22.04
            python-version: '3.9'
          - os: ubuntu-22.04
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.7'
          - os: windows-latest
            python-version: '3.11'
          - os: macos-latest
            python-version: '3.11'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Run tests (pytest)
        run: python -m pytest tests -q

      - name: Run tests (unittest, works offline)
        run: python scripts/run_tests.py

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint (flake8)
        run: python -m flake8 src tests

      - name: Type check (mypy)
        run: python -m mypy

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

      - name: Check the distribution metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      # Only runs when a GitHub release is published *and* the repository has a
      # PYPI_API_TOKEN secret; otherwise it skips cleanly instead of failing.
      - name: Publish to PyPI (release only)
        if: github.event_name == 'release'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "PYPI_API_TOKEN is not configured - skipping the upload."
            exit 0
          fi
          python -m twine upload dist/*
